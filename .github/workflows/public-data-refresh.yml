name: GridPulse Public Data Refresh

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridpulse-public-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh public analytics
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHON_VERSION: "3.12"

      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      AFDC_API_KEY: ${{ secrets.AFDC_API_KEY }}
      NOAA_USER_AGENT: ${{ secrets.NOAA_USER_AGENT }}

      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      STORAGE_BACKEND: local
      DATA_ROOT: data
      APP_ENV: ci
      LOG_LEVEL: INFO

      SPARK_LOCAL_IP: 127.0.0.1

      PUBLIC_API_URL: https://gridpulse-api-hruthikgavva-5884s-projects.vercel.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install GridPulse
        run: |
          set -euo pipefail

          uv sync \
            --frozen \
            --all-groups

          uv run python --version
          uv run python -c "import pyspark; print('PySpark', pyspark.__version__)"

      # ---------------------------------------------------------------
      # This workflow is deliberately stateless.
      #
      # GitHub Actions cache is allowed for dependency acceleration,
      # but analytical correctness never depends on restored application
      # data from a previous runner.
      # ---------------------------------------------------------------

      - name: Prepare clean analytical workspace
        run: |
          set -euo pipefail

          rm -rf \
            data/raw/streaming \
            data/processed/silver \
            data/processed/gold \
            data/quarantine \
            data/checkpoints \
            data/warehouse \
            data/observability

          mkdir -p \
            data/raw/streaming \
            data/processed \
            data/quarantine \
            data/checkpoints \
            data/warehouse \
            data/observability

          echo "Clean analytical workspace prepared."

      # ---------------------------------------------------------------
      # EPHEMERAL KAFKA
      # ---------------------------------------------------------------

      - name: Start ephemeral Kafka
        run: |
          set -euo pipefail

          docker compose \
            -f infrastructure/docker/docker-compose.kafka.yml \
            up -d

          echo "Waiting for Kafka..."

          ready=0

          for attempt in $(seq 1 60); do
            if docker exec gridpulse-kafka \
              /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --list >/dev/null 2>&1
            then
              ready=1
              echo "Kafka is ready."
              break
            fi

            echo "Kafka attempt ${attempt}/60..."
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Kafka did not become ready."
            docker compose \
              -f infrastructure/docker/docker-compose.kafka.yml \
              logs
            exit 1
          fi

          docker compose \
            -f infrastructure/docker/docker-compose.kafka.yml \
            ps

      - name: Create GridPulse Kafka topics
        run: |
          set -euo pipefail

          topics=(
            "gridpulse.eia.region-data.v1"
            "gridpulse.nws.forecast.v1"
            "gridpulse.afdc.ev-stations.v1"
            "gridpulse.dead-letter.v1"
          )

          for topic in "${topics[@]}"; do
            docker exec gridpulse-kafka \
              /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --create \
              --if-not-exists \
              --topic "$topic" \
              --partitions 3 \
              --replication-factor 1
          done

          echo
          echo "GridPulse topics:"
          docker exec gridpulse-kafka \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --list

      # ---------------------------------------------------------------
      # EIA HISTORY
      #
      # Public CI rebuilds a bounded rolling analytical window instead
      # of pretending GitHub cache is durable storage.
      #
      # replay_eia remains replay=true by design.
      #
      # Flag names are discovered from the module itself so this
      # workflow cannot drift from its argparse interface.
      # ---------------------------------------------------------------

      - name: Replay rolling EIA history through Kafka
        shell: bash
        run: |
          set -euo pipefail

          HELP="$(
            uv run python \
              -m gridpulse_intelligence.replay_eia \
              --help 2>&1
          )"

          START_FLAG="$(
            printf '%s\n' "$HELP" |
              grep -oE -- '--[A-Za-z0-9-]*start[A-Za-z0-9-]*' |
              head -1 || true
          )"

          END_FLAG="$(
            printf '%s\n' "$HELP" |
              grep -oE -- '--[A-Za-z0-9-]*end[A-Za-z0-9-]*' |
              head -1 || true
          )"

          SPEED_FLAG="$(
            printf '%s\n' "$HELP" |
              grep -oE -- '--[A-Za-z0-9-]*speed[A-Za-z0-9-]*' |
              head -1 || true
          )"

          if [ -z "$START_FLAG" ] || \
             [ -z "$END_FLAG" ] || \
             [ -z "$SPEED_FLAG" ]; then

            echo "Unable to discover replay_eia CLI flags."
            echo
            echo "$HELP"
            exit 1
          fi

          START_HOUR="$(
            date -u \
              -d '14 days ago' \
              '+%Y-%m-%dT%H'
          )"

          END_HOUR="$(
            date -u \
              -d '3 hours ago' \
              '+%Y-%m-%dT%H'
          )"

          echo "EIA replay window:"
          echo "  Start: $START_HOUR"
          echo "  End:   $END_HOUR"
          echo
          echo "Replay semantics: replay=true"

          timeout 15m \
            uv run python \
            -m gridpulse_intelligence.replay_eia \
            "$START_FLAG" "$START_HOUR" \
            "$END_FLAG" "$END_HOUR" \
            "$SPEED_FLAG" "36000"

      # ---------------------------------------------------------------
      # CURRENT SOURCE EVENTS
      #
      # These are normal non-replay source events and fill the current
      # edge of the analytical window.
      # ---------------------------------------------------------------

      - name: Publish current EIA NWS and AFDC events
        run: |
          set -euo pipefail

          timeout 10m \
            uv run python \
            -m gridpulse_intelligence.publish_sources \
            --source all \
            --eia-limit 200 \
            --weather-hours 48 \
            --latitude 41.4993 \
            --longitude -81.6944 \
            --state OH \
            --ev-limit 200

      - name: Verify source events reached Kafka
        run: |
          set -euo pipefail

          uv run python - <<'PY'
          from confluent_kafka import Consumer, TopicPartition


          topics = (
              "gridpulse.eia.region-data.v1",
              "gridpulse.nws.forecast.v1",
              "gridpulse.afdc.ev-stations.v1",
          )


          consumer = Consumer(
              {
                  "bootstrap.servers": "localhost:9092",
                  "group.id": "gridpulse-ci-verification",
                  "enable.auto.commit": False,
              }
          )


          try:
              for topic in topics:
                  metadata = consumer.list_topics(
                      topic=topic,
                      timeout=10,
                  )

                  topic_metadata = metadata.topics.get(topic)

                  if topic_metadata is None:
                      raise SystemExit(
                          f"Kafka topic missing: {topic}"
                      )

                  total = 0

                  for partition_id in topic_metadata.partitions:
                      low, high = consumer.get_watermark_offsets(
                          TopicPartition(
                              topic,
                              partition_id,
                          ),
                          timeout=10,
                      )

                      total += high - low

                  print(
                      f"{topic}: {total:,} event(s)"
                  )

                  if total <= 0:
                      raise SystemExit(
                          f"No events found in {topic}"
                      )

          finally:
              consumer.close()


          print()
          print("Kafka source verification: PASS")
          PY

      # ---------------------------------------------------------------
      # KAFKA -> SPARK -> BRONZE
      #
      # PySpark 4.2.0 requires the matching external Kafka connector.
      # ---------------------------------------------------------------

      - name: Stream Kafka events into Bronze
        env:
          PYSPARK_SUBMIT_ARGS: >-
            --packages
            org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
            pyspark-shell
        run: |
          set -euo pipefail

          timeout 20m \
            uv run python \
            -m gridpulse_intelligence.pipeline_runs \
            --stage kafka_to_bronze \
            -- \
            uv run python \
            pipelines/streaming/kafka_to_bronze.py \
            --bootstrap-servers localhost:9092 \
            --topics \
            "gridpulse.eia.region-data.v1,gridpulse.nws.forecast.v1,gridpulse.afdc.ev-stations.v1"

      - name: Validate Bronze output
        run: |
          set -euo pipefail

          BRONZE="data/raw/streaming/bronze_events"

          test -d "$BRONZE"

          PARQUET_COUNT="$(
            find "$BRONZE" \
              -type f \
              -name '*.parquet' |
              wc -l |
              tr -d ' '
          )"

          echo "Bronze parquet files: $PARQUET_COUNT"

          if [ "$PARQUET_COUNT" -lt 1 ]; then
            echo "Bronze contains no parquet data."
            exit 1
          fi

      # ---------------------------------------------------------------
      # SILVER
      # ---------------------------------------------------------------

      - name: Build Silver datasets
        run: |
          set -euo pipefail

          timeout 15m \
            uv run python \
            -m gridpulse_intelligence.pipeline_runs \
            --stage bronze_to_silver \
            -- \
            uv run python \
            pipelines/streaming/bronze_to_silver.py

      # ---------------------------------------------------------------
      # GOLD
      # ---------------------------------------------------------------

      - name: Build Gold marts
        run: |
          set -euo pipefail

          timeout 15m \
            uv run python \
            -m gridpulse_intelligence.pipeline_runs \
            --stage gold \
            -- \
            uv run python \
            pipelines/analytics/build_gold.py

      # ---------------------------------------------------------------
      # DBT / DUCKDB
      # ---------------------------------------------------------------

      - name: Build dbt analytics warehouse
        run: |
          set -euo pipefail

          timeout 15m \
            uv run dbt build \
            --project-dir analytics/dbt \
            --profiles-dir analytics/dbt

          test -f data/warehouse/gridpulse.duckdb

      # ---------------------------------------------------------------
      # PUBLIC ANALYTICS SNAPSHOT
      # ---------------------------------------------------------------

      - name: Build public DuckDB snapshot
        run: |
          set -euo pipefail

          uv run python \
            scripts/build_portfolio_snapshot.py

          test -f \
            src/gridpulse_intelligence/assets/gridpulse_portfolio.duckdb

      # ---------------------------------------------------------------
      # PUBLIC OPERATIONAL EVIDENCE
      #
      # Built after the real CI engineering run so freshness, incidents,
      # lineage, execution telemetry and data quality correspond to this
      # validated run rather than an old retained snapshot.
      # ---------------------------------------------------------------

      - name: Build public operational snapshot
        run: |
          set -euo pipefail

          uv run python \
            scripts/build_portfolio_operational_snapshot.py

          test -f \
            src/gridpulse_intelligence/assets/gridpulse_operational_snapshot.json

      - name: Validate public analytical snapshot
        run: |
          set -euo pipefail

          uv run python - <<'PY'
          from pathlib import Path

          import duckdb


          database = Path(
              "src/gridpulse_intelligence/assets/"
              "gridpulse_portfolio.duckdb"
          )


          if not database.exists():
              raise SystemExit(
                  "Public DuckDB snapshot does not exist."
              )


          minimums = {
              "mart_grid_hourly": 500,
              "mart_balancing_authority_performance": 20,
              "mart_ev_city_rankings": 1,
              "mart_weather_forecast": 12,
          }


          connection = duckdb.connect(
              str(database),
              read_only=True,
          )


          try:
              for table, minimum in minimums.items():
                  count = connection.execute(
                      f"""
                      select count(*)
                      from analytics.{table}
                      """
                  ).fetchone()[0]

                  print(
                      f"{table}: {count:,} rows"
                  )

                  if count < minimum:
                      raise SystemExit(
                          f"{table} has {count} rows; "
                          f"expected at least {minimum}."
                      )

          finally:
              connection.close()


          size_mb = (
              database.stat().st_size
              / 1024
              / 1024
          )


          print(
              f"Public snapshot size: "
              f"{size_mb:.2f} MB"
          )

          if size_mb >= 100:
              raise SystemExit(
                  "Public snapshot unexpectedly exceeds "
                  "100 MB."
              )


          print()
          print(
              "Public analytical snapshot: PASS"
          )
          PY

      # ---------------------------------------------------------------
      # SLIM VERCEL BUNDLE
      #
      # Spark, dbt and the engineering environment stay in CI/local.
      # Only the read-only FastAPI serving layer and generated snapshots
      # are deployed.
      # ---------------------------------------------------------------

      - name: Create slim Vercel API bundle
        run: |
          set -euo pipefail

          DEPLOY_DIR="$RUNNER_TEMP/gridpulse-vercel-api"

          rm -rf "$DEPLOY_DIR"

          mkdir -p \
            "$DEPLOY_DIR/src" \
            "$DEPLOY_DIR/.vercel"

          cp -R \
            src/gridpulse_intelligence \
            "$DEPLOY_DIR/src/"

          cp \
            src/index.py \
            "$DEPLOY_DIR/src/index.py"

          cp \
            vercel.json \
            "$DEPLOY_DIR/vercel.json"

          find "$DEPLOY_DIR" \
            -type d \
            -name '__pycache__' \
            -prune \
            -exec rm -rf '{}' +

          uv run python - <<'PY' > "$DEPLOY_DIR/requirements.txt"
          from importlib.metadata import version


          packages = (
              "duckdb",
              "fastapi",
              "httpx",
              "pydantic",
              "pydantic-settings",
              "tenacity",
              "structlog",
              "PyYAML",
              "confluent-kafka",
              "prometheus-client",
          )


          for package in packages:
              print(
                  f"{package}=={version(package)}"
              )
          PY

          cat > "$DEPLOY_DIR/.vercel/project.json" <<JSON
          {
            "orgId": "${VERCEL_ORG_ID}",
            "projectId": "${VERCEL_PROJECT_ID}"
          }
          JSON

          echo "DEPLOY_DIR=$DEPLOY_DIR" \
            >> "$GITHUB_ENV"

          echo
          echo "Slim deployment bundle:"
          du -sh "$DEPLOY_DIR"

          echo
          echo "Runtime requirements:"
          cat "$DEPLOY_DIR/requirements.txt"

      - name: Smoke test slim API bundle
        run: |
          set -euo pipefail

          SMOKE_VENV="$RUNNER_TEMP/gridpulse-api-smoke"

          rm -rf "$SMOKE_VENV"

          python -m venv "$SMOKE_VENV"

          "$SMOKE_VENV/bin/python" \
            -m pip install \
            --disable-pip-version-check \
            --quiet \
            -r "$DEPLOY_DIR/requirements.txt"

          VERCEL=1 \
          PYTHONPATH="$DEPLOY_DIR/src" \
          "$SMOKE_VENV/bin/python" - <<'PYTHON'
          import os

          from fastapi.testclient import TestClient

          from index import app


          def find_route(
              endpoint_name: str,
          ) -> str:
              """Find a FastAPI route from its endpoint function."""

              matches: list[str] = []

              for route in app.routes:
                  endpoint = getattr(
                      route,
                      "endpoint",
                      None,
                  )

                  function_name = getattr(
                      endpoint,
                      "__name__",
                      "",
                  )

                  route_name = getattr(
                      route,
                      "name",
                      "",
                  )

                  route_path = getattr(
                      route,
                      "path",
                      None,
                  )

                  if (
                      route_path
                      and (
                          function_name
                          == endpoint_name
                          or route_name
                          == endpoint_name
                      )
                  ):
                      matches.append(
                          route_path
                      )

              unique_matches = sorted(
                  set(matches)
              )

              if not unique_matches:
                  print()
                  print(
                      "Registered FastAPI routes:"
                  )

                  for route in app.routes:
                      print(
                          getattr(
                              route,
                              "path",
                              "<no-path>",
                          ),
                          "->",
                          getattr(
                              route,
                              "name",
                              "<no-name>",
                          ),
                      )

                  raise SystemExit(
                      "Unable to discover endpoint "
                      f"{endpoint_name!r}."
                  )

              return unique_matches[0]


          client = TestClient(app)


          status_route = find_route(
              "platform_status"
          )

          health_route = find_route(
              "platform_health"
          )


          print()
          print(
              "Discovered platform status route:",
              status_route,
          )

          print(
              "Discovered platform health route:",
              health_route,
          )


          status_response = client.get(
              status_route
          )

          print(
              status_route,
              status_response.status_code,
          )


          if status_response.status_code != 200:
              raise SystemExit(
                  "Platform status smoke test failed: "
                  f"{status_response.text}"
              )


          status = status_response.json()


          required_counts = {
              "grid_hourly_rows": 500,
              "balancing_authorities": 20,
              "ev_cities": 1,
              "weather_forecasts": 12,
          }


          for key, minimum in required_counts.items():
              value = int(
                  status.get(
                      key,
                      0,
                  )
              )

              print(
                  f"{key}: {value:,}"
              )

              if value < minimum:
                  raise SystemExit(
                      f"{key} is {value}; "
                      f"expected at least {minimum}."
                  )


          health_response = client.get(
              health_route
          )

          print(
              health_route,
              health_response.status_code,
          )


          if health_response.status_code != 200:
              raise SystemExit(
                  "Platform health endpoint failed: "
                  f"{health_response.text}"
              )


          health = health_response.json()

          warehouse = health.get(
              "warehouse",
              {},
          )

          if (
              warehouse.get("status")
              != "healthy"
          ):
              raise SystemExit(
                  "Portfolio warehouse health "
                  f"is not healthy: {health}"
              )


          operational_routes = (
              "/api/v1/platform/freshness",
              "/api/v1/platform/incidents",
              "/api/v1/platform/lineage",
              "/api/v1/platform/runs?limit=5",
              "/api/v1/platform/data-quality",
          )


          for route in operational_routes:
              response = client.get(
                  route
              )

              print(
                  route,
                  response.status_code,
              )

              if response.status_code != 200:
                  raise SystemExit(
                      f"{route} failed: "
                      f"{response.text}"
                  )


          github_env = os.environ[
              "GITHUB_ENV"
          ]


          with open(
              github_env,
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write(
                  "GRIDPULSE_STATUS_ROUTE="
                  f"{status_route}\n"
              )

              handle.write(
                  "GRIDPULSE_HEALTH_ROUTE="
                  f"{health_route}\n"
              )

              handle.write(
                  "EXPECTED_GRID_ROWS="
                  f"{status['grid_hourly_rows']}\n"
              )

              handle.write(
                  "EXPECTED_BA_ROWS="
                  f"{status['balancing_authorities']}\n"
              )

              handle.write(
                  "EXPECTED_EV_CITIES="
                  f"{status['ev_cities']}\n"
              )

              handle.write(
                  "EXPECTED_WEATHER_ROWS="
                  f"{status['weather_forecasts']}\n"
              )


          print()
          print(
              "Slim FastAPI bundle smoke test: PASS"
          )

          print(
              "Expected production counts recorded."
          )
          PYTHON

      - name: Deploy refreshed API to Vercel
        run: |
          set -euo pipefail

          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

          npx --yes \
            vercel@latest \
            deploy "$DEPLOY_DIR" \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN"

      # ---------------------------------------------------------------
      # PRODUCTION VERIFICATION
      # ---------------------------------------------------------------

      - name: Verify production GridPulse API
        run: |
          set -euo pipefail

          echo "Status route: $GRIDPULSE_STATUS_ROUTE"
          echo "Health route: $GRIDPULSE_HEALTH_ROUTE"

          verified=0

          for attempt in $(seq 1 30); do
            echo
            echo "Production verification ${attempt}/30..."

            STATUS_CODE="$(
              curl \
                --silent \
                --show-error \
                --output /tmp/gridpulse-status.json \
                --write-out "%{http_code}" \
                "$PUBLIC_API_URL$GRIDPULSE_STATUS_ROUTE" \
                || true
            )"

            HEALTH_CODE="$(
              curl \
                --silent \
                --show-error \
                --output /tmp/gridpulse-health.json \
                --write-out "%{http_code}" \
                "$PUBLIC_API_URL$GRIDPULSE_HEALTH_ROUTE" \
                || true
            )"

            echo "Status HTTP: $STATUS_CODE"
            echo "Health HTTP: $HEALTH_CODE"

            if \
              [ "$STATUS_CODE" = "200" ] \
              && [ "$HEALTH_CODE" = "200" ]
            then

              if uv run python - <<'PYTHON'
          import json
          import os
          from pathlib import Path


          status = json.loads(
              Path(
                  "/tmp/gridpulse-status.json"
              ).read_text()
          )

          health = json.loads(
              Path(
                  "/tmp/gridpulse-health.json"
              ).read_text()
          )


          expected = {
              "grid_hourly_rows": int(
                  os.environ[
                      "EXPECTED_GRID_ROWS"
                  ]
              ),
              "balancing_authorities": int(
                  os.environ[
                      "EXPECTED_BA_ROWS"
                  ]
              ),
              "ev_cities": int(
                  os.environ[
                      "EXPECTED_EV_CITIES"
                  ]
              ),
              "weather_forecasts": int(
                  os.environ[
                      "EXPECTED_WEATHER_ROWS"
                  ]
              ),
          }


          print()
          print(
              "Expected freshly built counts:"
          )

          for key, value in expected.items():
              print(
                  f"  {key}: {value:,}"
              )


          print()
          print(
              "Production counts:"
          )

          for key in expected:
              actual = int(
                  status.get(
                      key,
                      -1,
                  )
              )

              print(
                  f"  {key}: {actual:,}"
              )

              if actual != expected[key]:
                  raise SystemExit(
                      f"{key} has not converged yet: "
                      f"production={actual}, "
                      f"expected={expected[key]}"
                  )


          warehouse = health.get(
              "warehouse",
              {},
          )


          if (
              warehouse.get("status")
              != "healthy"
          ):
              raise SystemExit(
                  "Production warehouse health "
                  f"is not healthy: {health}"
              )


          print()
          print(
              "Fresh deployment counts match "
              "the CI-built snapshot."
          )
          PYTHON
              then
                verified=1
                break
              fi
            fi

            sleep 10
          done


          if [ "$verified" -ne 1 ]; then
            echo
            echo "Production API did not converge to the refreshed snapshot."

            echo
            echo "Last status response:"
            cat /tmp/gridpulse-status.json 2>/dev/null || true

            echo
            echo "Last health response:"
            cat /tmp/gridpulse-health.json 2>/dev/null || true

            exit 1
          fi


          echo
          echo "Verify public operational routes..."

          for route in \
            "/api/v1/platform/freshness" \
            "/api/v1/platform/incidents" \
            "/api/v1/platform/lineage" \
            "/api/v1/platform/data-quality"
          do
            HTTP_CODE="$(
              curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$PUBLIC_API_URL$route"
            )"

            echo "$route -> $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              exit 1
            fi
          done


          echo
          echo "=========================================="
          echo "GRIDPULSE PRODUCTION VERIFICATION: PASS"
          echo "=========================================="

      - name: Refresh summary
        if: always()
        run: |
          {
            echo "## GridPulse Public Data Refresh"
            echo
            echo "- Architecture: Public APIs → Kafka → Spark → Bronze → Silver → Gold → dbt → DuckDB → FastAPI"
            echo "- Historical EIA: bounded replay window with replay=true"
            echo "- Current EIA/NWS/AFDC: canonical Kafka events"
            echo "- Public serving mode: read-only portfolio snapshot"
            echo "- Production API: $PUBLIC_API_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Kafka
        if: always()
        run: |
          docker compose \
            -f infrastructure/docker/docker-compose.kafka.yml \
            down -v \
            --remove-orphans || true
